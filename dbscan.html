<!DOCTYPE html>
<html>
<head>
  <title>DBSCAN</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h2>DBSCAN - Clustering</h2>

    <div class="note">
      <b>CSV Format:</b> Must contain numeric columns (e.g. X,Y).<br>
      DBSCAN will assign Cluster labels (-1 = Noise).
    </div>

    <form action="/dbscan/result" method="post" enctype="multipart/form-data" class="form">
      <label>Upload Dataset CSV:</label>
      <input type="file" name="dataset" required>

      <label>eps (e.g. 0.8):</label>
      <input type="number" step="0.01" name="eps" value="0.80" required>

      <label>min_samples (e.g. 3):</label>
      <input type="number" name="min_samples" value="3" required>

      <button type="submit">Run DBSCAN</button>
    </form>

    <a class="back" href="/">← Back to Home</a>
  </div>
</body>
</html>
